name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate client bundle syntax
        run: node -c client.js
      - name: Validate locale JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('locale/uk.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/ru.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/zh.json', 'utf8'))"
          echo "All localization bundles and syntax validated successfully!"
